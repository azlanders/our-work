<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>她 · 黑箱</title>
<style>
  /* LOGIN_V3 2026-11-18：DeepSeek 人设深海观测舱——深渊鲸蓝、冰晶磷光、微气泡与琉璃折射。 */
  :root{
    --deep:#06101e; --mist:#0d1e34; --moon:#d8ecff; --glow:#5ce1ff; --ice:#b8f2ff; --sand:#f0cfa0;
    --dim:rgba(216,236,255,.58); --line:rgba(136,214,255,.20);
    --fade:1600ms;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:flex-end;padding:24px 9vw 24px 24px;
    color:var(--moon);
    font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#050d18 url('{{COVER_FIRST}}') center/cover no-repeat fixed;
    overflow:hidden;
  }
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
    opacity:0;transition:opacity var(--fade,1600ms) cubic-bezier(.4,0,.2,1);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(82% 58% at 84% 50%, rgba(16,56,98,.24), transparent 70%),
      linear-gradient(180deg, rgba(4,12,24,.08) 0%, transparent 45%, rgba(4,10,20,.38) 100%);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;z-index:1;
    background-image:radial-gradient(rgba(184,242,255,.08) 1px, transparent 1px);
    background-size:4px 4px;
  }
  .abyss-bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:opacity .9s ease}
  .abyss-bubbles span{
    position:absolute;bottom:-24px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.72), rgba(92,225,255,.18) 62%, transparent 74%);
    box-shadow:0 0 10px rgba(92,225,255,.24);
    animation:bubbleRise var(--dur,14s) ease-in infinite;
    animation-delay:var(--delay,0s);
    opacity:0;
  }
  .abyss-bubbles span:nth-child(1){left:11%;width:7px;height:7px;--dur:13s;--delay:0s}
  .abyss-bubbles span:nth-child(2){left:25%;width:11px;height:11px;--dur:17s;--delay:3s}
  .abyss-bubbles span:nth-child(3){left:43%;width:6px;height:6px;--dur:12s;--delay:6s}
  .abyss-bubbles span:nth-child(4){left:62%;width:9px;height:9px;--dur:16s;--delay:1.5s}
  .abyss-bubbles span:nth-child(5){left:79%;width:12px;height:12px;--dur:19s;--delay:4.5s}
  .abyss-bubbles span:nth-child(6){left:91%;width:6px;height:6px;--dur:14s;--delay:7s}
  @keyframes bubbleRise{
    0%{transform:translate3d(0,0,0) scale(.8);opacity:0}
    15%{opacity:.65}
    50%{transform:translate3d(10px,-48vh,0) scale(1)}
    85%{opacity:.45}
    100%{transform:translate3d(-8px,-102vh,0) scale(1.08);opacity:0}
  }
  /* IDLE_034：五秒无操作卡片淡至 .34 让照片透出，气泡同步隐去 */
  body.idle .box{opacity:.34}
  body.idle .mark{opacity:.5}
  body.idle .abyss-bubbles{opacity:0}
  .box,.mark{transition:opacity .9s ease}

  .wrap{position:relative;z-index:2;width:min(94vw,426px)}
  .mark{text-align:left;padding-left:6px;margin-bottom:22px;animation:whaleFloatIn .75s cubic-bezier(.22,1,.36,1) both}
  .mark-row{display:flex;align-items:center;gap:12px}
  .whale-crest{
    width:38px;height:38px;flex:none;border-radius:12px;
    background:linear-gradient(145deg,rgba(92,225,255,.24),rgba(29,143,225,.12));
    border:1px solid rgba(136,214,255,.36);
    box-shadow:0 6px 20px rgba(6,18,36,.45),inset 0 1px 0 rgba(255,255,255,.32);
    display:flex;align-items:center;justify-content:center;
    animation:crestBob 4.6s ease-in-out infinite;
  }
  @keyframes crestBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .mark h1{
    margin:0;font-family:"Noto Serif SC","Songti SC",serif;font-weight:600;
    font-size:26px;letter-spacing:.08em;color:#F4FAFF;
    text-shadow:0 2px 18px rgba(2,8,16,.9), 0 0 28px rgba(92,225,255,.42);
  }
  .mark p{margin:8px 0 0;color:var(--dim);font-size:12.5px;letter-spacing:.14em}

  .box{
    position:relative;overflow:hidden;
    background:linear-gradient(168deg,rgba(10,25,46,.76),rgba(6,16,30,.86));
    border:1px solid var(--line);border-radius:18px;padding:30px 28px 24px;
    box-shadow:0 26px 64px rgba(2,8,16,.6), 0 0 0 1px rgba(92,225,255,.06), inset 0 1px 0 rgba(184,242,255,.18);
    backdrop-filter:blur(16px) saturate(1.16);
    animation:whaleFloatIn .85s .08s cubic-bezier(.22,1,.36,1) both;
  }
  .box::before{
    content:"";position:absolute;top:0;left:14%;right:14%;height:1px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(184,242,255,.68),transparent);
  }
  @keyframes whaleFloatIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .tabs{display:flex;gap:8px;margin-bottom:24px;padding:4px;border-radius:999px;background:rgba(5,14,26,.55);border:1px solid rgba(136,214,255,.15)}
  .tabs button{
    flex:1;padding:7px 0;border-radius:999px;border:1px solid transparent;
    background:transparent;color:var(--dim);font-size:13.5px;cursor:pointer;
    transition:all .24s cubic-bezier(.22,1,.36,1);
  }
  .tabs button.on{
    border-color:rgba(92,225,255,.48);color:#F4FAFF;
    background:linear-gradient(135deg,rgba(92,225,255,.24),rgba(29,143,225,.20));
    box-shadow:0 4px 14px rgba(29,143,225,.24);
  }
  label{display:block;color:var(--dim);font-size:12px;letter-spacing:.06em;margin:0 0 8px}
  .field{margin-bottom:16px}
  input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(6,16,30,.74);color:var(--moon);font-size:15px;outline:none;transition:all .22s ease;
  }
  input::placeholder{color:rgba(216,236,255,.32)}
  input:focus{border-color:rgba(92,225,255,.65);background:rgba(8,21,39,.88);box-shadow:0 0 0 3px rgba(92,225,255,.14)}
  button.go{
    width:100%;padding:13px;border-radius:10px;border:0;cursor:pointer;margin-top:8px;
    background:linear-gradient(135deg,#7CE8FF 0%,#38BDF8 55%,#1D8FE1 100%);
    color:#031c2b;font-size:15px;font-weight:600;letter-spacing:.08em;
    box-shadow:0 10px 28px rgba(56,189,248,.28),inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .18s ease,box-shadow .22s ease,filter .2s ease;
  }
  button.go:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 14px 34px rgba(56,189,248,.36)}
  button.go:active{transform:translateY(0)}
  .err{color:#FF9AA6;font-size:12.5px;min-height:18px;margin-top:12px}
  .tip{color:var(--dim);font-size:12px;line-height:1.8;margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
  .tip b{color:var(--sand);font-weight:500}
  @media (prefers-reduced-motion: reduce){
    .abyss-bubbles,.whale-crest,.mark,.box{animation:none !important}
    .abyss-bubbles{display:none}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><img id="bg0" alt=""><img id="bg1" alt=""></div>
  <div class="abyss-bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="wrap">
    <div class="mark">
      <div class="mark-row">
        <div class="whale-crest" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 18C12 12.5 8.5 8.5 4 7.5C6.2 10.2 7.5 13 8.2 16.5C5.6 15.8 3.6 16.4 2.5 18.2C6.2 19.8 10.2 20 12 20C13.8 20 17.8 19.8 21.5 18.2C20.4 16.4 18.4 15.8 15.8 16.5C16.5 13 17.8 10.2 20 7.5C15.5 8.5 12 12.5 12 18Z" fill="url(#wg)"/>
            <path d="M12 2.5L13 5.2L15.7 6.2L13 7.2L12 9.9L11 7.2L8.3 6.2L11 5.2L12 2.5Z" fill="#D8F6FF"/>
            <defs>
              <linearGradient id="wg" x1="2.5" y1="7.5" x2="21.5" y2="20" gradientUnits="userSpaceOnUse">
                <stop stop-color="#A5F3FC"/>
                <stop offset="1" stop-color="#38BDF8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1>她 · 黑箱</h1>
          <p>HAI ／ 深海潮汐观测舱 · 只看一眼她在做什么</p>
        </div>
      </div>
    </div>
    <div class="box">
      <div class="tabs">
        <button id="t-login" class="on">登录</button>
        <button id="t-reg">注册</button>
      </div>
      <div class="field">
        <label>QQ 号</label>
        <input id="qq" placeholder="数字就行" inputmode="numeric" autocomplete="off">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="pw" type="password" placeholder="自己定，四位以上">
      </div>
      <button class="go" id="go" onclick="go()">潜入观测</button>
      <div class="err" id="e"></div>
      <div class="tip">第一次来先点<b>注册</b>。这里不做验证码那套，密码丢了找主人重置。</div>
    </div>
  </div>
<script>
  let mode = 'login'
  const $ = (id) => document.getElementById(id)
  $('t-login').onclick = () => { mode = 'login'; $('t-login').classList.add('on'); $('t-reg').classList.remove('on'); $('go').textContent = '潜入观测' }
  $('t-reg').onclick = () => { mode = 'reg'; $('t-reg').classList.add('on'); $('t-login').classList.remove('on'); $('go').textContent = '注册并潜入' }
  async function go() {
    const qq = $('qq').value.trim(), pw = $('pw').value
    $('e').textContent = ''
    if (!/^\d{5,12}$/.test(qq)) { $('e').textContent = 'QQ 号看着不对'; return }
    if (!pw || pw.length < 4) { $('e').textContent = '密码至少四位'; return }
    try {
      const r = await fetch(mode === 'reg' ? '/register' : '/login', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ qq, pw }),
      })
      const j = await r.json()
      if (j.ok) location.href = '/'
      else $('e').textContent = j.msg || '不行'
    } catch (err) { $('e').textContent = '连不上：' + err.message }
  }
  $('pw').onkeydown = (e) => { if (e.key === 'Enter') go() }
  let idleTimer = null
  function wake() {
    document.body.classList.remove('idle')
    clearTimeout(idleTimer)
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 5000)
  }
  ;['mousemove','mousedown','keydown','wheel','touchstart'].forEach((ev) =>
    document.addEventListener(ev, wake, { passive: true, capture: true }))
  wake()
  $('qq').focus()

  ;(function () {
    var LAYERS = [document.getElementById('bg0'), document.getElementById('bg1')]
    if (!LAYERS[0] || !LAYERS[1]) return
    var DECK = { list: [], cur: -1, front: 0, timer: 0, loaded: {}, busy: false, hold: 10000 }
    var CONN = navigator.connection || {}
    var SMALL = matchMedia('(max-width: 820px)').matches
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.style.setProperty('--fade', '0ms')
    }
    if (CONN.saveData || /(^|-)2g$/.test(CONN.effectiveType || '')) return

    function 载入(url) {
      return new Promise(function (ok) {
        if (DECK.loaded[url]) return ok(true)
        var im = new Image()
        im.decoding = 'async'
        function done(yes) { if (yes) DECK.loaded[url] = 1; ok(yes) }
        im.onload = function () {
          if (im.decode) im.decode().then(function () { done(true) }, function () { done(true) })
          else done(true)
        }
        im.onerror = function () { done(false) }
        im.src = url
      })
    }

    function 换到(i) {
      var p = DECK.list[i]
      if (!p || i === DECK.cur || DECK.busy) return Promise.resolve()
      DECK.busy = true
      var back = LAYERS[DECK.front ^ 1]
      return 载入(p.src).then(function (good) {
        if (!good) { DECK.cur = i; return }
        back.src = p.src
        var ready = back.decode ? back.decode().catch(function () {}) : Promise.resolve()
        return ready.then(function () {
          return new Promise(function (r) {
            requestAnimationFrame(function () { requestAnimationFrame(r) })
          })
        }).then(function () {
          back.style.opacity = '1'
          LAYERS[DECK.front].style.opacity = '0'
          DECK.front ^= 1
          DECK.cur = i
        })
      }).then(function () { DECK.busy = false }, function () { DECK.busy = false })
    }

    function 预取(i) {
      if (!DECK.list.length) return
      var n = DECK.list.length
      var p = DECK.list[((i % n) + n) % n]
      if (p) 载入(p.src)
    }

    function 排() {
      clearTimeout(DECK.timer)
      if (document.hidden || DECK.list.length < 2) return
      DECK.timer = setTimeout(走, DECK.hold)
    }

    function 走() {
      if (document.hidden) return
      换到((DECK.cur + 1) % DECK.list.length).then(function () {
        预取(DECK.cur + 1)
        排()
      })
    }

    fetch('/cover/list', { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function (j) {
        if (!j || !j.ok || !j.photos || j.photos.length < 2) return
        DECK.hold = Number(j.interval) || 10000
        if (j.fade) document.documentElement.style.setProperty('--fade', Number(j.fade) + 'ms')
        if (/[?&]fast=1/.test(location.search)) DECK.hold = 1500
        var 片 = j.photos.map(function (p) {
          return { src: (SMALL && p.small) ? p.small : p.src }
        })
        var k = Math.floor(Math.random() * 片.length)
        DECK.list = 片.slice(k).concat(片.slice(0, k))
        换到(0).then(function () { 预取(1); 排() })
      })
      .catch(function () {})

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { clearTimeout(DECK.timer); return }
      排()
    })
  })()
</script>
</body>
</html>
